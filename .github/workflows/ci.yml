name: CI

# Chạy mỗi lần đẩy lên develop/main và với mọi pull request. Bốn job chạy song song; mỗi job là một "status check" riêng
# để bật bắt buộc trong Settings > Branches (tên check: checks, tests, build, secrets).
# Không có e2e (Playwright): cố ý để ngoài CI vì chậm hơn; chạy tay bằng `npm run test:e2e` khi cần.
on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # Kiểm tra kiểu, lint, và schema khớp migration (nhanh, chạy đầu tiên).
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Kiểm tra kiểu
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Schema khớp migration
        # Đổi src/db/schema.ts mà quên sinh migration thì lệnh này tạo tệp mới trong drizzle/ và bước dưới làm CI đỏ.
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts đã đổi nhưng chưa có migration. Chạy 'npm run db:generate' rồi commit thư mục drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

  # 463 test đơn vị và database. DB test dùng PGlite trong bộ nhớ nên không cần dịch vụ ngoài.
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Build thật. Chỉ dùng biến giả, không bao giờ đụng vào database hay khóa thật.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: pglite:./.data/ci
      BETTER_AUTH_SECRET: ci-only-secret-not-used-for-anything-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  # Quét bí mật trong toàn bộ lịch sử commit, dùng cấu hình .gitleaks.toml của repo.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cài gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version
      - name: Quét
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
