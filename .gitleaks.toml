# Mở rộng bộ luật mặc định của gitleaks; chỉ loại trừ các false positive đã biết,
# mỗi mục giới hạn theo luật (generic-api-key) VÀ theo đường dẫn VÀ theo mẫu dòng.
[extend]
useDefault = true

# Mật khẩu giả trong test (matkhau-..., sai-roi-nhe, chuỗi số ngắn) chỉ ở tệp *.test.ts(x)
[[allowlists]]
description = "Mật khẩu giả trong test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''\.test\.tsx?$''']
regexTarget = "line"
regexes = ['''(?i)password\s*[:=]\s*'(matkhau-[a-z0-9-]+|sai-[a-z-]+|[0-9]{1,8}|a)\'''']

# Bảng ký tự sinh mật khẩu tạm
[[allowlists]]
description = "Bảng ký tự sinh mật khẩu tạm, không phải bí mật"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''src/server/admin\.ts$''']
regexTarget = "line"
regexes = ['''TEMP_PASSWORD_ALPHABET\s*=''']

# Mật khẩu giả của tài khoản e2e (chỉ dùng trên DB pglite dựng lại mỗi lần chạy)
[[allowlists]]
description = "Mật khẩu giả trong e2e"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^e2e/[a-z-]+\.(spec\.)?ts$''']
regexTarget = "line"
regexes = ['''(?i)password2?\s*[:=]\s*'(matkhau-rieng-[0-9]|quan-tri-e2e-[0-9])\'''']
